name: Testes

# A busca roda no computador do Leonardo (Agendador de Tarefas do Windows).
# Aqui só rodam os testes e a checagem de tipos a cada push.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
