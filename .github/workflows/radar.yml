name: Radar de Vagas

on:
  schedule:
    # 09:30 UTC = 06:30 em Brasília, todo dia
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      no_email:
        description: "Não enviar o e-mail (só coletar e dar nota)"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  radar:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coletar, dar nota e enviar resumo
        run: npm run radar -- ${{ inputs.no_email && '--no-email' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
