name: Radar de Vagas

on:
  schedule:
    # 09:30 UTC = 06:30 em Brasília, todo dia
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      no_email:
        description: "Não enviar o e-mail (só coletar e dar nota)"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  radar:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Checar segredos
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Segredos do Supabase ainda não configurados; execução pulada."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - name: Coletar, dar nota e enviar resumo
        if: steps.secrets.outputs.ready == 'true'
        run: npm run radar -- ${{ inputs.no_email && '--no-email' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
